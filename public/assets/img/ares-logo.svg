<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ares">
  <defs>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="120" y1="90" x2="420" y2="450">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#DCE1E7"/>
      <stop offset="0.72" stop-color="#A7AEB8"/>
      <stop offset="1" stop-color="#79808B"/>
    </linearGradient>
    <linearGradient id="placa" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#15181C"/>
      <stop offset="0.6" stop-color="#0A0B0D"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#placa)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>

  <!-- Monograma: tres trazos de grosor constante y remates redondos.
       Sin bisel ni contorno: la geometría sola sostiene la marca. -->
  <g fill="none" stroke="url(#metal)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M137 418 L256 104 L375 418"/>
    <path d="M186 316 L326 316"/>
  </g>
</svg>
